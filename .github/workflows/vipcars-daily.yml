name: VipCars daily run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vipcars-daily.yml"
      - "src/vipcars/**"
      - "tests/**"
      - "vipcars.config.example.json"
      - "package.json"
      - "package-lock.json"
  schedule:
    # Runs at 02:30 Europe/Warsaw year-round; two UTC crons handle CET/CEST.
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      locations:
        description: "Comma-separated VipCars locations"
        required: true
        default: "Warsaw,Krakow,Gdansk,Katowice,Wroclaw,Poznan"
      pickup_weekdays:
        description: "Comma-separated pickup weekdays, used when pickup_rolling_days is empty"
        required: false
        default: ""
      pickup_rolling_days:
        description: "Number of consecutive pickup dates from today"
        required: false
        default: "30"
      durations:
        description: "Comma-separated rental durations in days"
        required: true
        default: "2,3,4,5,6,7,8,9,10"
      currency:
        description: "VipCars display currency"
        required: true
        default: "EUR"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SCHEDULE_LOCATIONS: "Warsaw,Krakow,Gdansk,Katowice,Wroclaw,Poznan"
  SCHEDULE_PICKUP_WEEKDAYS: ""
  SCHEDULE_PICKUP_ROLLING_DAYS: "30"
  SCHEDULE_DURATIONS: "2,3,4,5,6,7,8,9,10"
  SCHEDULE_CURRENCY: "EUR"
  PUSH_TEST_LOCATIONS: "Warsaw"
  PUSH_TEST_PICKUP_WEEKDAYS: "friday"
  PUSH_TEST_PICKUP_ROLLING_DAYS: ""
  PUSH_TEST_DURATIONS: "2"
  PUSH_TEST_CURRENCY: "EUR"
  SCHEDULE_CHUNK_COUNT: "15"

jobs:
  prepare:
    name: Resolve VipCars run options
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      locations: ${{ steps.options.outputs.locations }}
      pickup_weekdays: ${{ steps.options.outputs.pickup_weekdays }}
      pickup_rolling_days: ${{ steps.options.outputs.pickup_rolling_days }}
      durations: ${{ steps.options.outputs.durations }}
      currency: ${{ steps.options.outputs.currency }}
      chunk_total: ${{ steps.options.outputs.chunk_total }}
      chunk_matrix: ${{ steps.options.outputs.chunk_matrix }}

    steps:
      - name: Check Warsaw schedule gate
        id: gate
        shell: bash
        run: |
          warsaw_now="$(TZ=Europe/Warsaw date '+%Y-%m-%d %H:%M:%S %Z')"
          warsaw_offset="$(TZ=Europe/Warsaw date +%z)"
          trigger_schedule="${{ github.event.schedule }}"
          echo "Warsaw time now: $warsaw_now"
          echo "Warsaw UTC offset: $warsaw_offset"
          echo "Schedule trigger: ${trigger_schedule:-not-scheduled}"

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use the cron expression instead of runner start hour because GitHub can delay scheduled jobs.
          if [[ "$warsaw_offset" == "+0200" && "$trigger_schedule" == "30 0 * * *" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$warsaw_offset" == "+0100" && "$trigger_schedule" == "30 1 * * *" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve run options
        if: steps.gate.outputs.should_run == 'true'
        id: options
        shell: bash
        env:
          INPUT_LOCATIONS: ${{ inputs.locations }}
          INPUT_PICKUP_WEEKDAYS: ${{ inputs.pickup_weekdays }}
          INPUT_PICKUP_ROLLING_DAYS: ${{ inputs.pickup_rolling_days }}
          INPUT_DURATIONS: ${{ inputs.durations }}
          INPUT_CURRENCY: ${{ inputs.currency }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            default_locations="$PUSH_TEST_LOCATIONS"
            default_pickup_weekdays="$PUSH_TEST_PICKUP_WEEKDAYS"
            default_pickup_rolling_days="$PUSH_TEST_PICKUP_ROLLING_DAYS"
            default_durations="$PUSH_TEST_DURATIONS"
            default_currency="$PUSH_TEST_CURRENCY"
            chunk_total="1"
          else
            default_locations="$SCHEDULE_LOCATIONS"
            default_pickup_weekdays="$SCHEDULE_PICKUP_WEEKDAYS"
            default_pickup_rolling_days="$SCHEDULE_PICKUP_ROLLING_DAYS"
            default_durations="$SCHEDULE_DURATIONS"
            default_currency="$SCHEDULE_CURRENCY"
            chunk_total="${SCHEDULE_CHUNK_COUNT:-3}"
          fi

          locations="${INPUT_LOCATIONS:-$default_locations}"
          pickup_weekdays="${INPUT_PICKUP_WEEKDAYS:-$default_pickup_weekdays}"
          pickup_rolling_days="${INPUT_PICKUP_ROLLING_DAYS:-$default_pickup_rolling_days}"
          durations="${INPUT_DURATIONS:-$default_durations}"
          currency="${INPUT_CURRENCY:-$default_currency}"

          if ! [[ "$chunk_total" =~ ^[0-9]+$ ]] || [[ "$chunk_total" -lt 1 ]]; then
            chunk_total="1"
          fi

          if ! [[ "$pickup_rolling_days" =~ ^[0-9]+$ ]] || [[ "$pickup_rolling_days" -lt 1 ]]; then
            chunk_total="1"
          elif [[ "$pickup_rolling_days" -lt "$chunk_total" ]]; then
            chunk_total="$pickup_rolling_days"
          fi

          chunk_values="$(seq -s, 1 "$chunk_total")"
          chunk_matrix="{\"chunk\":[${chunk_values}]}"

          echo "locations=$locations" >> "$GITHUB_OUTPUT"
          echo "pickup_weekdays=$pickup_weekdays" >> "$GITHUB_OUTPUT"
          echo "pickup_rolling_days=$pickup_rolling_days" >> "$GITHUB_OUTPUT"
          echo "durations=$durations" >> "$GITHUB_OUTPUT"
          echo "currency=$currency" >> "$GITHUB_OUTPUT"
          echo "chunk_total=$chunk_total" >> "$GITHUB_OUTPUT"
          echo "chunk_matrix=$chunk_matrix" >> "$GITHUB_OUTPUT"

  test:
    name: Run VipCars tests
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install

      - name: Run tests
        run: npm test

  scrape:
    name: Scrape VipCars chunk ${{ matrix.chunk }}/${{ needs.prepare.outputs.chunk_total }}
    needs:
      - prepare
      - test
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.chunk_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run VipCars scraper
        shell: bash
        env:
          LOCATIONS: ${{ needs.prepare.outputs.locations }}
          PICKUP_WEEKDAYS: ${{ needs.prepare.outputs.pickup_weekdays }}
          PICKUP_ROLLING_DAYS: ${{ needs.prepare.outputs.pickup_rolling_days }}
          DURATIONS: ${{ needs.prepare.outputs.durations }}
          CURRENCY: ${{ needs.prepare.outputs.currency }}
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_TOTAL: ${{ needs.prepare.outputs.chunk_total }}
        run: |
          mkdir -p output
          mkdir -p "artifacts/vipcars/chunk-${CHUNK_INDEX}"
          set -o pipefail

          command=(node src/vipcars/cli.js \
            --config vipcars.config.example.json \
            --locations "$LOCATIONS" \
            --durations-days "$DURATIONS" \
            --currency "$CURRENCY" \
            --timeout-ms 45000 \
            --artifacts-dir "artifacts/vipcars/chunk-${CHUNK_INDEX}" \
            --output-csv "output/vipcars-results-chunk-${CHUNK_INDEX}.csv")

          if [[ -n "$PICKUP_ROLLING_DAYS" ]]; then
            command+=(--pickup-rolling-days "$PICKUP_ROLLING_DAYS")
          elif [[ -n "$PICKUP_WEEKDAYS" ]]; then
            command+=(--pickup-weekdays "$PICKUP_WEEKDAYS")
          fi

          if [[ "$CHUNK_TOTAL" != "1" ]]; then
            command+=(--pickup-chunk-index "$CHUNK_INDEX" --pickup-chunk-total "$CHUNK_TOTAL")
          fi

          "${command[@]}" \
            2> >(tee "output/vipcars-run-error-chunk-${CHUNK_INDEX}.txt" >&2) \
            | tee "output/vipcars-run-log-chunk-${CHUNK_INDEX}.txt"

      - name: Upload VipCars chunk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vipcars-results-chunk-${{ matrix.chunk }}-${{ github.run_number }}
          path: |
            output/vipcars-results-chunk-${{ matrix.chunk }}.csv
            output/vipcars-run-log-chunk-${{ matrix.chunk }}.txt
            output/vipcars-run-error-chunk-${{ matrix.chunk }}.txt
            artifacts/vipcars/chunk-${{ matrix.chunk }}/**
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Merge, publish, and notify
    needs:
      - prepare
      - test
      - scrape
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download VipCars chunk results
        uses: actions/download-artifact@v4
        with:
          path: chunk-artifacts
          pattern: vipcars-results-chunk-*-${{ github.run_number }}

      - name: Merge VipCars chunk results
        shell: bash
        run: |
          mkdir -p output
          node src/vipcars/mergeCsv.js chunk-artifacts output/vipcars-results.csv
          find chunk-artifacts -type f -name 'vipcars-run-log-chunk-*.txt' -exec cat {} + > output/vipcars-run-log.txt || true
          find chunk-artifacts -type f -name 'vipcars-run-error-chunk-*.txt' -exec cat {} + > output/vipcars-run-error.txt || true

      - name: Generate VipCars HTML report
        shell: bash
        run: node src/vipcars/reportHtml.js output/vipcars-results.csv output/vipcars-report.html

      - name: Prepare GitHub Pages site
        if: hashFiles('output/vipcars-report.html') != ''
        run: |
          mkdir -p public
          cp output/vipcars-report.html public/index.html
          cp output/vipcars-report.html public/report.html
          cp output/vipcars-results.csv public/vipcars-results.csv
          cp output/vipcars-run-log.txt public/vipcars-run-log.txt || true
          cp output/vipcars-run-error.txt public/vipcars-run-error.txt || true

      - name: Configure GitHub Pages
        if: hashFiles('public/report.html') != ''
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: hashFiles('public/report.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: pages-deployment
        if: hashFiles('public/report.html') != ''
        uses: actions/deploy-pages@v4

      - name: Upload VipCars merged results
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vipcars-results-${{ github.run_number }}
          path: |
            output/vipcars-results.csv
            output/vipcars-report.html
            output/vipcars-run-log.txt
            output/vipcars-run-error.txt
            chunk-artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Notify Telegram
        if: steps.pages-deployment.outputs.page_url != '' && steps.upload.outputs['artifact-url'] != ''
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          PAGE_URL: ${{ steps.pages-deployment.outputs.page_url }}
          ARTIFACT_URL: ${{ steps.upload.outputs['artifact-url'] }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRAPE_RESULT: ${{ needs.scrape.result }}
          CHUNK_TOTAL: ${{ needs.prepare.outputs.chunk_total }}
          LOCATIONS: ${{ needs.prepare.outputs.locations }}
          PICKUP_ROLLING_DAYS: ${{ needs.prepare.outputs.pickup_rolling_days }}
          DURATIONS: ${{ needs.prepare.outputs.durations }}
          CURRENCY: ${{ needs.prepare.outputs.currency }}
        run: |
          chat_ids="${TELEGRAM_CHAT_IDS:-$TELEGRAM_CHAT_ID}"
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$chat_ids" ]]; then
            echo "::warning::Telegram secrets are missing; notification skipped."
            exit 0
          fi

          status_text="gotowy"
          if [[ "$SCRAPE_RESULT" != "success" ]]; then
            status_text="czesciowy; jeden z chunkow wymaga sprawdzenia (${SCRAPE_RESULT})"
          fi

          message=$(printf 'VipCars: raport HTML jest %s.\n\nZakres:\n- chunki: %s\n- lokalizacje: %s\n- rolling days: %s\n- durations: %s\n- waluta: %s\n\nRaport HTML:\n%sreport.html\n\nArtifact backup:\n%s\n\nGitHub Actions run:\n%s\n' "$status_text" "$CHUNK_TOTAL" "$LOCATIONS" "$PICKUP_ROLLING_DAYS" "$DURATIONS" "$CURRENCY" "$PAGE_URL" "$ARTIFACT_URL" "$RUN_URL")

          # TELEGRAM_CHAT_IDS can contain one or more comma-separated private chats, groups, or channels.
          IFS=',' read -ra recipients <<< "$chat_ids"
          for chat_id in "${recipients[@]}"; do
            chat_id="$(echo "$chat_id" | xargs)"
            if [[ -z "$chat_id" ]]; then
              continue
            fi
            if ! curl --fail --show-error --silent \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${message}" \
              --data-urlencode "disable_web_page_preview=true"; then
              echo "::warning::Telegram notification failed for chat_id=${chat_id}; scraper results were still uploaded."
            fi
          done
